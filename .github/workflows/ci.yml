name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# Batalkan run yang sudah tertimpa push baru — hemat energi dan kuota.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # Versi pnpm TIDAK disetel di sini. `packageManager` di package.json adalah
      # satu-satunya sumber kebenaran; menyetel keduanya membuat action-setup
      # gagal dengan "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # `astro check` memvalidasi TypeScript DAN skema konten.
      # data.json atau frontmatter yang melanggar aturan akan menggagalkan build.
      - run: pnpm build

      - name: Pastikan setiap halaman benar-benar ter-generate
        run: |
          for f in index.html about/index.html projects/index.html \
                   projects/inventory-accuracy/index.html \
                   projects/quality-system/index.html \
                   projects/ops-analytics/index.html \
                   contact/index.html contact/success/index.html contact/error/index.html \
                   cv/index.html \
                   id/index.html id/about/index.html id/projects/index.html \
                   id/projects/inventory-accuracy/index.html \
                   id/projects/quality-system/index.html \
                   id/projects/ops-analytics/index.html \
                   id/contact/index.html id/contact/success/index.html \
                   id/contact/error/index.html id/cv/index.html \
                   404.html sitemap.xml robots.txt resume.json \
                   og/og-en.png og/og-id.png \
                   cv/cv-en.pdf cv/cv-id.pdf cv/cv.manifest.json; do
            test -s "dist/$f" || { echo "::error::dist/$f tidak dihasilkan"; exit 1; }
          done
          echo "Semua halaman dan aset ada."

      # Penjaga struktural untuk jebakan ADR-009 #1: rute yang salah bentuk
      # membuang SELURUH halaman bahasa Indonesia tanpa galat apa pun. Daftar
      # eksplisit di atas hanya menangkap halaman yang sudah diketahui — cek
      # paritas ini menangkap halaman baru yang lupa dibuatkan pasangan ID-nya.
      - name: Paritas jumlah halaman EN vs ID
        run: |
          en=$(find dist -name index.html -not -path 'dist/id/*' | wc -l)
          id=$(find dist/id -name index.html | wc -l)
          echo "EN=$en  ID=$id"
          test "$en" -eq "$id" || { echo "::error::halaman EN ($en) dan ID ($id) tidak seimbang"; exit 1; }

      - name: Tidak ada placeholder yang lolos ke produksi
        run: |
          if grep -rlE 'PLACEHOLDER|lorem ipsum|TODO:' dist --include='*.html'; then
            echo "::error::masih ada teks placeholder di dist/"; exit 1
          fi
          echo "Nol placeholder."

      - name: Tautan internal tidak ada yang rusak
        run: |
          fail=0
          for f in $(find dist -name '*.html'); do
            for href in $(grep -oE 'href="/[^"#?]*"' "$f" | sed 's/href="//;s/"//'); do
              t="dist${href%/}"
              [ -f "$t" ] || [ -f "$t/index.html" ] || [ -f "dist$href" ] || {
                echo "::error file=$f::tautan rusak $href"; fail=1; }
            done
          done
          test "$fail" -eq 0
          echo "Nol tautan internal rusak."

      # PDF CV di-commit, bukan dibangkitkan saat build (ADR-011), sehingga ia
      # bisa menyimpang diam-diam dari src/data.json. Manifest menyimpan sidik
      # jari data saat PDF dibuat; kalau tidak cocok, isinya sudah basi.
      - name: PDF CV tidak boleh basi terhadap src/data.json
        run: |
          want=$(sha256sum src/data.json | cut -d' ' -f1)
          have=$(node -p "require('./public/cv/cv.manifest.json').dataHash")
          if [ "$want" != "$have" ]; then
            echo "::error::PDF CV basi. src/data.json berubah sejak PDF dibuat."
            echo "  data.json : $want"
            echo "  manifest  : $have"
            echo "  Perbaiki : pnpm build && pnpm pdf, lalu commit public/cv/"
            exit 1
          fi
          pages=$(node -p "Object.values(require('./public/cv/cv.manifest.json').pages).join(',')")
          echo "PDF mutakhir — halaman: $pages"
          node -e "
            const p = require('./public/cv/cv.manifest.json').pages;
            const bad = Object.entries(p).filter(([, n]) => n < 1 || n > 2);
            if (bad.length) { console.error('::error::CV di luar batas 1-2 halaman: ' + JSON.stringify(p)); process.exit(1); }
          "

      # Data pribadi yang tidak pernah boleh masuk repo (rencana §6.4).
      # Email SENGAJA dikecualikan: pemilik memublikasikannya (ADR-011).
      - name: Nol nomor telepon atau alamat rumah di keluaran
        run: |
          if grep -rIEl '\+62[0-9]{9,}|\b(RT\.?[0-9]+ *[/ ] *RW\.?[0-9]+)' dist --include='*.html' --include='*.json'; then
            echo "::error::data pribadi terdeteksi di dist/"; exit 1
          fi
          echo "Nol nomor telepon / alamat rumah."
